# ═══════════════════════════════════════════════════════════════════
# Unified Quant Research Platform - Docker Compose (Local Backend)
# ═══════════════════════════════════════════════════════════════════
# 
# This docker-compose.yml orchestrates the complete platform with local backend:
# - SQLite: Primary database for strategies, features, models, etc.
# - DiskCache: Local disk-based caching
# - MinIO: Object storage for artifacts and feature store (optional)
# - MLflow: Experiment tracking
# - Unified API: Single container with Research + Data layers
#
# Local backend means no external services required (all local)
# Everything runs in-process with local disk storage.
#
# Usage:
#   docker-compose up -d           # Start all services
#   docker-compose logs -f api    # Follow API logs
#   docker-compose down           # Stop all services
# ═══════════════════════════════════════════════════════════════════

services:
  # ── MinIO (S3-compatible storage) ──────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: quant_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── MLflow ────────────────────────────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: quant_mlflow
    command: mlflow server --host 0.0.0.0 --port 5000 --default-artifact-root s3://research-artifacts/mlflow
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    ports:
      - "5000:5000"
    depends_on:
      minio:
        condition: service_healthy

  # ── Unified API (Research + Data Layer) ────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.unified
    container_name: quant_api
    environment:
      # Database (SQLite - local file)
      SQLITE_PATH: /app_data/research_layer.db
      # Cache (DiskCache - local directory)
      CACHE_DIR: /app_cache
      # S3/MinIO
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET_ARTIFACTS: research-artifacts
      S3_BUCKET_FEATURES: feature-store
      # MLflow
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: research-layer
      MLFLOW_ARTIFACT_ROOT: s3://research-artifacts/mlflow
      # Data Layer (using embedded mode)
      DATA_SERVICE_URL: internal  # Signals internal mode
      DATA_SERVICE_API_KEY: dev-api-key-change-in-production
      # App
      APP_ENV: production
      SECRET_KEY: change-me-in-production
    ports:
      - "8000:8000"
    volumes:
      - app_data:/app_data
      - app_cache:/app_cache
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

# ── Volumes ────────────────────────────────────────────────────────
volumes:
  app_data:      # SQLite database file
  app_cache:     # DiskCache directory
  minio_data:    # MinIO object storage

# ── Networks ───────────────────────────────────────────────────────
networks:
  default:
    name: quant_network
